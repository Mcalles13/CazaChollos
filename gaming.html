<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CazaChollos - Gaming</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #222;
}

header {
    background: #111;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    font-size: 36px;
    margin-bottom: 5px;
}

header p {
    font-size: 17px;
    color: #ccc;
}

nav {
    background: #ffcc00;
    padding: 12px;
    text-align: center;
}

nav a {
    color: #111;
    text-decoration: none;
    margin: 0 15px;
    font-weight: bold;
}

nav a:hover {
    text-decoration: underline;
}

.contenedor {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
}

.contenedor h2 {
    margin-bottom: 20px;
}

.productos {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
}

.producto {
    background: white;
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}

.producto .imagen {
    height: 180px;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.producto .imagen img {
    max-width: 100%;
    max-height: 180px;
    object-fit: contain;
}

.producto h3 {
    margin-bottom: 10px;
}

.precio {
    font-size: 24px;
    font-weight: bold;
    margin: 12px 0;
}

.boton {
    display: inline-block;
    background: #ffcc00;
    color: #111;
    padding: 10px 18px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
}

.boton:hover {
    background: #e6b800;
}

footer {
    margin-top: 40px;
    background: #111;
    color: #aaa;
    text-align: center;
    padding: 25px;
}

</style>

</head>


<body>


<header>

    <h1>🛒 CazaChollos</h1>

    <p>Grandes chollos, precios increíbles</p>

</header>


<nav>

    <a href="index.html">Inicio</a>

    <a href="gaming.html">Gaming</a>

    <a href="#">Moda</a>

    <a href="#">Tecnología</a>

</nav>

    <p>
        Descubre los mejores chollos en Gaming.
    </p>

</section>


<section class="contenedor">

    <div class="productos">


        <!-- AQUÍ IREMOS AÑADIENDO LOS PRODUCTOS GAMING -->


        <div class="producto">

            <div class="imagen">
                🎮

            <h3>Próximamente</h3>

            <p>
                Aquí aparecerán nuevos chollos Gaming.
            </p>

        </div>


    </div>

</section>


<footer>

    <p>
        © 2026 CazaChollos - Todos los derechos reservados
    </p>

</footer>


</body>

</html>
